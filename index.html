<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#0b0d12">
  <title>QUEBRA NO TEMPO — Iniciando jogo</title>
  <!-- O GitHub Pages publica a raiz do repositório, mas o jogo precisa
       usar os módulos compilados pelo Vite em dist/. Nunca carregar
       src/main.js diretamente no navegador: ele importa "three". -->
  <meta http-equiv="refresh" content="0; url=./dist/">
  <style>
    :root{color-scheme:dark}
    html,body{height:100%;margin:0}
    body{display:grid;place-items:center;background:#0b0d12;color:#eef0f4;font-family:system-ui,Arial,sans-serif;text-align:center;padding:16px;box-sizing:border-box}
    main{max-width:520px}
    h1{font-size:clamp(32px,6vw,60px);line-height:1;letter-spacing:.04em;margin:0 0 16px}
    h1 span{color:#ffb030}
    p{color:#aeb7c7;line-height:1.5}
    a{display:inline-block;margin-top:12px;border:1px solid #ffb030;color:#ffb030;padding:12px 22px;text-decoration:none;font-weight:700}
    a:hover,a:focus-visible{background:#ffb030;color:#111}
  </style>
  <script>
    // Preserva parâmetros e fragmento, sem adicionar uma tela extra ao histórico.
    const destino = new URL('./dist/', window.location.href);
    destino.search = window.location.search;
    destino.hash = window.location.hash;
    window.location.replace(destino.href);
  </script>
</head>
<body>
  <main>
    <h1>QUEBRA <span>NO TEMPO</span></h1>
    <p>Iniciando a versão compilada do jogo…</p>
    <a href="./dist/">Entrar no jogo</a>
  </main>
</body>
</html>
