name: Testar e publicar Quebra no Tempo

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: publicar-quebra-no-tempo
  cancel-in-progress: false

jobs:
  publicar:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Testar animações, controlador e entradas
        run: npm test
      - name: Preparar navegador de verificação
        run: |
          npm install --no-save --package-lock=false playwright@1.56.1
          npx playwright install --with-deps chromium
      - name: Verificar carregamento WebGL das duas missões
        run: node tools/browser-smoke.mjs
      - name: Preparar arquivos estáticos
        run: |
          mkdir -p "$RUNNER_TEMP/qnt-site"
          cp index.html figurinos.html README.md CHANGELOG.md "$RUNNER_TEMP/qnt-site/"
          cp -R src models vendor docs "$RUNNER_TEMP/qnt-site/"
          touch "$RUNNER_TEMP/qnt-site/.nojekyll"
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: ${{ runner.temp }}/qnt-site
      - name: Publicar site
        id: deployment
        uses: actions/deploy-pages@v4
